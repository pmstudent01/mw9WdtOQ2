  $type: |-
    {
      "type": "object",
      "properties": {
        "nickName": {
          "type": "string"
        },
        "vin": {
          "type": "string"
        },
        "make": {
          "type": "string"
        },
        "model": {
          "type": "string"
        },
        "year": {
          "type": "string"
        },
        "miles": {
          "type": "integer"
        }
      }
    }
settings: {}
