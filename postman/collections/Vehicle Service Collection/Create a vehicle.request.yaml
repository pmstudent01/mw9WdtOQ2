$kind: http-request
url: "{{baseUrl}}/vehicles"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "nickName": "The Lisa Marie",
      "vin": "4M2DV11W4RDJ53329",
      "make": "Mercury",
      "model": "Villager",
      "year": "1994",
      "miles": 159864
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "nickName": {
          "type": "string"
        },
        "vin": {
          "type": "string"
        },
        "make": {
          "type": "string"
        },
        "model": {
          "type": "string"
        },
        "year": {
          "type": "string"
        },
        "miles": {
          "type": "integer"
        }
      }
    }
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
examples: ./.resources/Create a vehicle.resources/examples
order: 1000
