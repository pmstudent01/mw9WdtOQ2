$kind: http-example
request:
  url: "{{baseUrl}}/vehicles/:id"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    id: "0"
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Vehicle with id: 0 not found."
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        }
      }
order: 2000
