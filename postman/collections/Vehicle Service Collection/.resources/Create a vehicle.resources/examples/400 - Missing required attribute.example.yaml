$kind: http-example
request:
  url: "{{baseUrl}}/vehicles"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "nickName": "RIP College Fund",
        "vin": "4M2DV11W4RDJ53329",
        "make": "GMC",
        "model": "Hummer EV",
        "year": "2026",
        "miles": 12
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Request body missing required attribute: vin"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        }
      }
order: 3000
