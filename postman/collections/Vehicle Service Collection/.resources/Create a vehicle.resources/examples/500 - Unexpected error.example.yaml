$kind: http-example
request:
  url: "{{baseUrl}}/vehicles"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "nickName": "K.I.T.T.",
        "vin": "1G2AW87H4CL514714",
        "make": "Pontiac",
        "model": "Trans Am",
        "year": "1982",
        "miles": 100024
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "An unexpected error occurred."
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        }
      }
order: 4000
