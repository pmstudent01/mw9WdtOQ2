$kind: http-example
request:
  url: "{{baseUrl}}/vehicles"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "An unexpected error occurred."
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        }
      }
order: 2000
